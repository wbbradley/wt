[package]
name = "wt"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
fs2 = "0.4"
libc = "0.2"
ratatui = "0.29"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
ureq = { version = "3.1", features = ["json"] }
